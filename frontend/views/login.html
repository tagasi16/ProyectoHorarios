<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acceso Administrador — UniSimón Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-body">
  <div class="login-split">
    <!-- LEFT PANEL -->
    <div class="login-brand">
      <div class="login-brand-inner">
        <img src="/images/escudo.png" alt="Escudo UniSimón" class="login-escudo" onerror="this.style.display='none'; document.getElementById('fb').style.display='flex'">
        <div id="fb" class="escudo-fallback login-escudo-fallback" style="display:none">USB</div>
        <h1 class="login-university">Universidad<br>Simón Bolívar</h1>
        <p class="login-tagline">Sistema de Gestión de Horarios</p>
        <div class="login-brand-deco"></div>
      </div>
    </div>
    <!-- RIGHT PANEL -->
    <div class="login-form-panel">
      <div class="login-form-inner">
        <div class="login-form-header">
          <h2>Acceso Restringido</h2>
          <p>Solo personal autorizado</p>
        </div>
        <form id="login-form" class="login-form">
          <div class="login-field">
            <label for="username">Usuario</label>
            <div class="input-icon-wrap">
              <!-- <span class="input-icon">👤</span> -->
              <input type="text" id="username" name="username" placeholder="admin" autocomplete="username" required>
            </div>
          </div>
          <div class="login-field">
            <label for="password">Contraseña</label>
            <div class="input-icon-wrap">
              <!-- <span class="input-icon">🔒</span> -->
              <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
            </div>
          </div>
          <div id="login-error" class="login-error" style="display:none"></div>
          <button type="submit" class="btn-login" id="login-btn">
            <span id="login-btn-text">Ingresar</span>
          </button>
        </form>
        <a href="/" class="login-back">← Volver al horario público</a>
      </div>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
